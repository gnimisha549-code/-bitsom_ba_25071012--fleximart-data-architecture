name: FlexiMart Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fleximart
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo --health-interval 10s --health-timeout 5s --health-retries 5
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        cd part1-database-etl
        pip install -r requirements.txt
    
    - name: Run Part 1 ETL Tests
      run: |
        cd part1-database-etl
        python etl_pipeline.py
        cat data_quality_report.txt
    
    - name: Run Part 1 Business Queries
      run: mysql -h127.0.0.1 -P3306 -uroot -proot fleximart < part1-database-etl/business_queries.sql
    
    - name: Run Part 2 MongoDB Tests
      run: mongosh < part2-nosql/mongodb_operations.js
    
    - name: Verify Part 2 Collections
      run: |
        mongosh --eval "db.stats()" fleximart_products
        mongosh fleximart_products --eval "db.products.countDocuments()"
    
    - name: Run Part 3 Warehouse Tests
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE fleximart_dw"
        mysql -h127.0.0.1 -P3306 -uroot -proot fleximart_dw < part3-datawarehouse/warehouse_schema.sql
        mysql -h127.0.0.1 -P3306 -uroot -proot fleximart_dw < part3-datawarehouse/analytics_queries.sql
